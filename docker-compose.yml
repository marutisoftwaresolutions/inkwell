# Inkwell — full stack: the app, SQL Server, and Caddy for automatic TLS.
#
#   cp .env.example .env      # fill in a real SA password and your domain
#   docker compose up -d
#
# First boot: `db-init` creates the `blog` database and applies DBScripts/init.sql (the complete
# schema), then exits; the app starts only after it succeeds and MigrationService applies anything
# newer on startup. db-init re-runs on every `up` and changes nothing on an existing database. Once
# the app reports healthy, visit your domain and the setup wizard runs.
#
# The app's own port is deliberately NOT published to the host — only Caddy's 80/443 are reachable
# from outside the compose network. That is what makes ReverseProxy__TrustForwardedHeaders safe to
# enable below: nothing but Caddy can ever reach the app container. For local evaluation without a
# domain or TLS, uncomment the `ports:` line under `app` and drop the `caddy` service.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot: a new SQL Server container has no `blog` database, and the app cannot connect to one
  # that does not exist. Creates it if missing, then applies init.sql (idempotent, UTF-8).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./DBScripts:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -Q "IF DB_ID(N'blog') IS NULL CREATE DATABASE [blog];"
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -I -f 65001 -d blog -i /scripts/init.sql
    restart: "no"

  app:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=blog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      DeploymentMode: SelfHosted
      CanonicalHost: ${DOMAIN}
      ReverseProxy__TrustForwardedHeaders: "true"
      DataProtection__KeysPath: /data/keys
      # Add SMTP__Host / SMTP__Username / ... here (or in .env, referenced the same way as DOMAIN)
      # for password reset and error-alert email; both features degrade safely without it.
    volumes:
      - app-keys:/data/keys
      - app-uploads:/app/wwwroot/uploads
      - app-ogcache:/app/wwwroot/og-cache
    # ports:
    #   - "8080:8080"   # only for local evaluation WITHOUT Caddy — see the note above
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped

volumes:
  db-data:
  app-keys:
  app-uploads:
  app-ogcache:
  caddy-data:
  caddy-config:

name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Who runs into it and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Inkwell to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or nothing.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / writing
        - Themes and layouts
        - Desk (admin)
        - Analytics / SEO
        - Comments / newsletter / forms
        - Import / export
        - Deployment / Docker
        - API
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true

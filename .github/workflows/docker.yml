# Builds the image and boots the full compose stack on an empty database, so the Docker deployment
# in README.md is proven by running it, not by reading it (the file-content checks in
# Blog.Tests/DockerDeploymentTests.cs missed three bugs that stopped it working, reported 2026-10-25).
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write a throwaway .env
        run: |
          printf 'DOMAIN=localhost\nMSSQL_SA_PASSWORD=Ci-%s-Aa1!\n' "$(openssl rand -hex 12)" > .env

      - name: Build the image
        run: docker compose build app

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 60); do
            id=$(docker compose ps -q app)
            if [ -n "$id" ]; then
              status=$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || true)
              echo "app: ${status:-starting}"
              [ "$status" = "healthy" ] && exit 0
            fi
            sleep 5
          done
          echo "The app did not become healthy in 5 minutes."; exit 1

      - name: db-init succeeded and the schema is complete
        run: |
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq db-init)")" = "0"
          set -a; . ./.env; set +a
          tables=$(docker compose exec -T -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" db \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d blog -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables" | tr -d '[:space:]')
          echo "tables in blog: $tables"
          test "$tables" -ge 45

      - name: The site answers through Caddy without a server error
        run: |
          curl -fsSk https://localhost/robots.txt > /dev/null
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)
          echo "GET / -> $code"
          test "$code" -lt 500
          if docker compose logs app | grep -q "Migration Error"; then echo "Migration failed on startup."; exit 1; fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
